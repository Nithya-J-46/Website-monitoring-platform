<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Uptime History</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
            font-weight: 500;
        }

        .header a {
            color: white;
            text-decoration: none;
            background-color: #2563eb;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }

        .site-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .site-url {
            font-size: 14px;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .uptime-text {
            font-size: 14px;
            margin-bottom: 10px;
            color: #374151;
        }

        .bars {
            display: flex;
            gap: 4px;
        }

        .bar {
            width: 6px;
            height: 18px;
            border-radius: 3px;
            background-color: #e5e7eb;
        }

        .bar.up {
            background-color: #22c55e;
        }

        .bar.down {
            background-color: #ef4444;
        }

        .legend {
            margin-top: 25px;
            font-size: 14px;
            color: #374151;
        }

        .legend span {
            margin-right: 15px;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .dot.up {
            background-color: #22c55e;
        }

        .dot.down {
            background-color: #ef4444;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>Uptime History</h2>
    <a href="/dashboard">Back to Dashboard</a>
</div>

<div class="container">

    {% for site in websites %}
    <div class="card">
        <div class="site-title">{{ site.website_name }}</div>
        <div class="site-url">{{ site.url }}</div>

        <!-- ✅ NEW: Uptime Percentage -->
        <div class="uptime-text">
            Uptime:
            <strong>{{ site.uptime_percent }}%</strong>
            (last {{ site.total_checks }} checks)
        </div>

        <!-- Status Bars -->
        <div class="bars">
            {% for status in site.statuses %}
                {% if status == "UP" %}
                    <div class="bar up"></div>
                {% else %}
                    <div class="bar down"></div>
                {% endif %}
            {% endfor %}
        </div>
    </div>
    {% endfor %}

    <!-- Legend -->
    <div class="legend">
        <span><span class="dot up"></span>UP</span>
        <span><span class="dot down"></span>DOWN</span>
    </div>

</div>

</body>
</html>
