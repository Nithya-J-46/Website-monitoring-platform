<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Uptime Status</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        .up {
            color: #16a34a;
            font-weight: 600;
        }

        .down {
            color: #dc2626;
            font-weight: 600;
        }
        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
        }
        .status.UP {
            background-color: #28a745;
            box-shadow: 0 0 10px #28a745;
        }
        .status.DOWN {
            background-color: #dc3545;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>

<body>

<div class="header">
    <h2>Uptime Status</h2>
    <a href="/dashboard">← Back to Dashboard</a>
</div>

<div class="container">
    <div class="card">
        <table>
            <tr>
                <th>Website</th>
                <th>URL</th>
                <th>Status</th>
                <th>Last Checked</th>
            </tr>

            {% for site in websites %}
            <tr>
                <td>
                    <span class="status {{ site.status }}">
                        {{ site.status }}
                    </span>
                </td>
                <td>{{ site.checked_at }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>

</body>
</html>
